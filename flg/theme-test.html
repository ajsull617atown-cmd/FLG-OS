<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%}
  .bg{
    min-height:100vh;
    background:
      radial-gradient(at 20% 20%, rgba(255,45,45,0.38) 0%, transparent 55%),
      radial-gradient(at 80% 80%, rgba(255,30,30,0.24) 0%, transparent 55%),
      linear-gradient(180deg, #1a0505 0%, #0a0000 45%, #000000 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .glass{
    background:rgba(5,5,7,0.55);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.12);
    padding:24px;border-radius:12px;color:#fff;
    font-family:monospace;max-width:80%;
  }
</style>
<div class="bg"><div class="glass">ai-lab-8k-fixed + glossi-obsidian-glass blur(24px)<br>Now you can see the theme working.</div></div>
