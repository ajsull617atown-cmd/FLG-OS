async def refresh_repos() -> list[dict]:
    """10-page pagination loop page 1..10 per_page 100, orgs/ajsull617atown-cmd/repos"""
    global repos, production_grid_data
    collected = []
    
    headers = {"Accept": "application/vnd.github.v3+json"}

        f"{settings.GITHUB_API}/orgs/{settings.GITHUB_OWNER}/repos",
        f"{settings.GITHUB_API}/users/{settings.GITHUB_OWNER}/repos"
    ]
    
    async with httpx.AsyncClient(timeout=30) as client:
        for base_url in base_urls:
            if collected:
                break
            for page in range(1, 11):  # 10 pages x 100 = 1000
                try:
                    resp = await client.get(
                        base_url,
                        params={"page": page, "per_page": 100, "sort": "pushed", "direction": "desc"},
                        headers=headers
                    )
                    if resp.status_code != 200:
                        print(f"[GITHUB] page {page} status {resp.status_code} for {base_url}")

                    data = resp.json()

                except Exception as e:

        "timestamp": datetime.utcnow().isoformat()
    }

const { app, BrowserWindow } = require('electron');
const { spawn } = require('child_process');
const net = require('net');
const path = require('path');
const crypto = require('crypto');
const http = require('http');

let backendProcess = null;
let mainWindow = null;

// ENV - FL_PORT, FL_SESSION_SECRET, GITHUB_OWNER ajsull617atown-cmd
const FL_SESSION_SECRET = crypto.randomBytes(32).toString('hex');
const GITHUB_OWNER = 'ajsull617atown-cmd';
process.env.FL_SESSION_SECRET = FL_SESSION_SECRET;
process.env.GITHUB_OWNER = GITHUB_OWNER;
process.env.FL_PORT = '0'; // will be assigned

function findAvailablePort(start = 8000) {
  return new Promise((resolve) => {
    const srv = net.createServer();
    srv.listen(start, '127.0.0.1', () => {
      const port = srv.address().port;
      srv.close(() => resolve(port));
    });
    srv.on('error', () => resolve(findAvailablePort(start + 1)));
  });
}

function waitForBackend(port, secret, retries = 60) {
  return new Promise((resolve, reject) => {
    let attempts = 0;
    const check = () => {
      const req = http.request({
        host: '127.0.0.1',
        port,
        path: '/health?token=' + secret,
        headers: { 'x-fl-session': secret },
        timeout: 2000
      }, (res) => {
        if (res.statusCode === 200) {
          console.log('[*] Backend ready at port', port);
          resolve();
        } else {
          retry();
        }
      });
      req.on('error', retry);
      req.end();
    };
    const retry = () => {
      attempts++;
      if (attempts > retries) return reject(new Error('Backend timeout'));
      setTimeout(check, 1000);
    };
    check();
  });
}

function startBackend(port) {
  const isPackaged = app.isPackaged;
  let cmd, args, env;
  env = { ...process.env, FL_PORT: String(port), FL_SESSION_SECRET, GITHUB_OWNER };

  if (isPackaged) {
    // fl_os_server.exe - PyInstaller binary
    const exePath = path.join(process.resourcesPath, 'fl_os_server.exe');
    cmd = exePath;
    args = [];
    console.log('[*] Starting packaged backend:', exePath);
  } else {
    cmd = 'python';
    args = ['server_entry.py'];
    console.log('[*] Starting dev backend: python server_entry.py');
  }

  backendProcess = spawn(cmd, args, {
    env,
    cwd: __dirname,
    stdio: 'inherit'
  });

  backendProcess.on('error', (e) => console.error('[!] Backend spawn error', e));
}

async function createWindow() {
  const port = await findAvailablePort(8000);
  process.env.FL_PORT = String(port);
  console.log(\`[*] FL OS 8K SHD Dev Server http://127.0.0.1:\${port} - WIRED\`);
  console.log(\`[*] OWNER ajsull617atown-cmd | SESSION \${FL_SESSION_SECRET.slice(0,16)}... | COMPOSITOR 7680x4320 33.2MP\`);

  startBackend(port);

  try {
    await waitForBackend(port, FL_SESSION_SECRET, 90);
  } catch (e) {
    console.error('[!] Backend failed to start', e);
  }

  mainWindow = new BrowserWindow({
    width: 1920,
    height: 1080,
    title: 'FactoryLine Gaming OS v4.1 8K SHD - FINAL 1000+ REAL WIRED',
    backgroundColor: '#050507',
    webPreferences: {
      nodeIntegration: false,
      contextIsolation: true
    }
  });

  // Load with token - x-fl-session auth via query
  mainWindow.loadURL(\`http://127.0.0.1:\${port}/?token=\${FL_SESSION_SECRET}\`);
  // mainWindow.webContents.openDevTools();
}

app.whenReady().then(createWindow);
app.on('window-all-closed', () => {
  if (backendProcess) backendProcess.kill();
  if (process.platform !== 'darwin') app.quit();
});
app.on('before-quit', () => {
  if (backendProcess) backendProcess.kill();
});
