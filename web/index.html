<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLG-OS X</title>
<style>
  :root{--bg:#0a0a0a;--fg:#f5f5f5;--card:#1a1a1a;--accent:#ff3b30}
  [data-theme="light"]{--bg:#f5f5f5;--fg:#0a0a0a;--card:#ffffff}
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
  body{background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center;transition:.3s}
  .os{width:92%;max-width:480px;background:var(--card);border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
  h1{font-size:32px;letter-spacing:-1px;margin-bottom:8px}
  p{opacity:.6;margin-bottom:24px}
  button{width:100%;padding:14px;border-radius:12px;border:0;background:var(--fg);color:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
  .meta{margin-top:20px;font-size:12px;opacity:.4}
</style>
</head>
<body>
<div class="os">
  <h1>FLG-OS X</h1>
  <p>Factory Labs Gaming - Reactor OS</p>
  <button id="toggle">Toggle Dark / Light</button>
  <div class="meta">theme: <span id="state">dark</span> • prefs: reactor_prefs</div>
</div>
<script>
  const KEY='dark_mode';
  const saved=localStorage.getItem(KEY);
  let isDark=saved?JSON.parse(saved):true;
  function apply(){document.documentElement.setAttribute('data-theme',isDark?'dark':'light');document.getElementById('state').textContent=isDark?'dark':'light'}
  apply();
  document.getElementById('toggle').onclick=()=>{isDark=!isDark;localStorage.setItem(KEY,isDark);apply()};
</script>
</body>
</html>
